name: Docker CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build CLI Docker image
        run: docker build . --file Dockerfile --tag mzap:ci

      - name: Build GitHub Action Docker image
        run: docker build . --file github-action/Dockerfile --tag mzap-action:ci

      - name: Smoke test CLI image
        run: docker run --rm mzap:ci version

      - name: Smoke test GitHub Action image
        run: docker run --rm mzap-action:ci version

---
name: Build and Release .deb Package
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (e.g., 1.0.0)"
        required: true
        type: string
  release:
    types: [published]
permissions:
  contents: write
jobs:
  build-deb:
    strategy:
      matrix:
        arch: [amd64, arm64]
    runs-on: ubuntu-latest
    steps:
      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1
      - name: Checkout source code
        uses: actions/checkout@v6
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Get Version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
      - name: Build mzap Binary
        run: |
          docker run --rm --platform linux/${{ matrix.arch }} -v $(pwd):/mzap -w /mzap --entrypoint="" 84codes/crystal:latest-debian-12 sh -c "
            apt-get update && apt-get install -y libyaml-dev ca-certificates git curl &&
            shards install --production &&
            /usr/bin/crystal build src/mzap_cli.cr -o mzap --release --no-debug --static
          "
      - name: Create Debian Package Structure
        run: |
          mkdir -p mzap_${{ env.VERSION }}_${{ matrix.arch }}/DEBIAN
          mkdir -p mzap_${{ env.VERSION }}_${{ matrix.arch }}/usr/bin
          mkdir -p mzap_${{ env.VERSION }}_${{ matrix.arch }}/usr/share/doc/mzap
          cp mzap mzap_${{ env.VERSION }}_${{ matrix.arch }}/usr/bin/
          cp README.md mzap_${{ env.VERSION }}_${{ matrix.arch }}/usr/share/doc/mzap/
          cp LICENSE mzap_${{ env.VERSION }}_${{ matrix.arch }}/usr/share/doc/mzap/
      - name: Create DEBIAN/control file
        run: |
          cat > mzap_${{ env.VERSION }}_${{ matrix.arch }}/DEBIAN/control << EOF
          Package: mzap
          Version: ${{ env.VERSION }}
          Architecture: ${{ matrix.arch }}
          Maintainer: HAHWUL <hahwul@gmail.com>
          Description: Multi-target ZAP scanning CLI tool.
          Depends: libc6 (>= 2.17)
          EOF
      - name: Build .deb Package
        run: |
          dpkg-deb --build mzap_${{ env.VERSION }}_${{ matrix.arch }}
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: mzap_${{ env.VERSION }}_${{ matrix.arch }}.deb
          path: ./
      - name: Upload .deb to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            mzap_${{ env.VERSION }}_${{ matrix.arch }}.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

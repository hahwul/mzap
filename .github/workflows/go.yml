name: Crystal

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: 1.19.1

      - name: Install dependencies
        run: |
          shards install

      - name: Build
        run: crystal build --release src/mzap_cli.cr -o bin/mzap

      - name: Test
        run: crystal spec
